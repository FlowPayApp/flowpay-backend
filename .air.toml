# Air: recompila y reinicia el servidor al guardar cambios en .go
# Uso: desde esta carpeta →  air
# Instalación: go install github.com/air-verse/air@latest
# (asegurate de tener %USERPROFILE%\go\bin en el PATH)

root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main.exe"
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  delay = 200
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = "0s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
