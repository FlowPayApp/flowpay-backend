      - application/x-www-form-urlencoded
      description: StatusCallback de Twilio. Siempre exige la firma.
      parameters:
      - description: Firma de Twilio
        in: header
        name: X-Twilio-Signature
        required: true
        type: string
      - description: SID del mensaje
        in: formData
        name: MessageSid
        required: true
        type: string
      - description: Estado (sent, delivered, read, failed...)
        in: formData
        name: MessageStatus
        required: true
        type: string
      - description: Código de error
        in: formData
        name: ErrorCode
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Webhook de estado de entrega de WhatsApp
      tags:
      - Webhooks
  /api/webhooks/twilio/whatsapp:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Lo llama Twilio. Exige X-Twilio-Signature cuando FLOWPAY_TWILIO_VALIDATE_WEBHOOK
        está activo.
      parameters:
      - description: Firma de Twilio
        in: header
        name: X-Twilio-Signature
        type: string
      - description: Remitente (whatsapp:+56...)
        in: formData
        name: From
        required: true
        type: string
      - description: Número de la empresa
        in: formData
        name: To
        required: true
        type: string
      - description: Texto
        in: formData
        name: Body
        type: string
      - description: Cantidad de adjuntos
        in: formData
        name: NumMedia
        type: integer
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
        "403":
          description: Forbidden
        "500":
          description: Internal Server Error
      summary: Webhook de mensajes entrantes de WhatsApp
      tags:
      - Webhooks
