basePath: /
definitions:
  controller.companyMailboxBody:
    properties:
      from_email:
        type: string
      from_name:
        type: string
      smtp_host:
        type: string
      smtp_password:
        type: string
      smtp_port:
        type: string
      smtp_username:
        type: string
    type: object
  controller.companyWhatsAppBody:
    properties:
      phone_number:
        example: "+56912345678"
        type: string
    type: object
  controller.errorResponse:
    properties:
      error:
        example: not found
        type: string
    type: object
  controller.idResponse:
    properties:
      id:
        example: 42
        type: integer
    type: object
  controller.okResponse:
    properties:
      ok:
        example: true
        type: boolean
    type: object
  controller.rejectPaymentPortalBody:
    properties:
      reason:
        type: string
    type: object
  controller.reminderCooldownResponse:
    properties:
      available_at:
        example: "2026-11-02T15:04:05Z"
        type: string
      channel:
        example: whatsapp
        type: string
      error:
        type: string
    type: object
  controller.replyWhatsAppBody:
    properties:
      text:
        type: string
    type: object
  controller.sendReminderBody:
    properties:
      channels:
        items:
          type: string
        type: array
    type: object
  controller.simulateInboundBody:
    properties:
      text:
        type: string
    type: object
  domain.ReminderPolicy:
    properties:
      days_before:
        description: DaysBefore días antes del vencimiento en que se avisa; 0 es el
          mismo día del vencimiento.
        items:
          type: integer
        type: array
      overdue_every:
        description: OverdueEvery cada cuántos días se insiste con un cobro vencido.
        type: integer
      overdue_max:
        description: 'OverdueMax tope de avisos con el cobro vencido: 0 ninguno, OverdueUnlimited
          sin tope.'
        type: integer
    type: object
  model.CompanyMailbox:
    properties:
      company_id:
        type: integer
      from_email:
        type: string
      from_name:
        type: string
      id:
        type: integer
      password_set:
        type: boolean
      smtp_host:
        type: string
      smtp_port:
        type: string
      smtp_username:
        type: string
      updated_at:
        type: string
    type: object
  model.Inbox:
    properties:
      threads:
        items:
          $ref: '#/definitions/model.UnreadThread'
        type: array
      total:
        type: integer
    type: object
  model.Message:
    properties:
      charge_id:
        type: integer
      company_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      delivery_error:
        type: string
      direction:
        type: string
      from_number:
        type: string
      id:
        type: integer
      media:
        items:
          $ref: '#/definitions/model.MessageMedia'
        type: array
      read_at:
        type: string
      status:
        description: 'Status en los enviados sigue la entrega en Twilio: queued, sent,
          delivered, read, failed, undelivered.'
        type: string
      to_number:
        type: string
    type: object
  model.MessageMedia:
    properties:
      content_type:
        type: string
      file_name:
        type: string
    type: object
  model.UnreadThread:
    properties:
      charge_id:
        type: integer
      client_name:
        type: string
      has_media:
        type: boolean
      last_at:
        type: string
      preview:
        type: string
      unread:
        type: integer
    type: object
  model.WhatsAppNumber:
    properties:
      company_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      phone_number:
        type: string
      status:
        type: string
      twilio_sid:
        type: string
    type: object
  repository.CompanyOverviewRow:
    properties:
      company_id:
        type: integer
      company_name:
        type: string
      overdue_amount:
        type: number
      owed_amount:
        type: number
      paid_amount:
        type: number
      pending_amount:
        type: number
    type: object
  repository.DashboardTotals:
    properties:
      overdue_amount:
        type: number
      overdue_count:
        type: integer
      paid_amount:
        type: number
      paid_count:
        type: integer
      pending_amount:
        type: number
      pending_count:
        type: integer
    type: object
  repository.Reminder:
    properties:
      channel:
        type: string
      charge_id:
        type: integer
      created_at:
        type: string
      delivery_error:
        type: string
      delivery_status:
        description: 'DeliveryStatus solo en WhatsApp: lo que Twilio informa de la
          entrega. Vacío si no hay seguimiento.'
        type: string
      id:
        type: integer
      kind:
        type: string
      message:
        type: string
      sent_at:
        type: string
      status:
        type: string
    type: object
  repository.ReminderTemplateRow:
    properties:
      body:
        type: string
      company_id:
        type: integer
      day_max:
        type: integer
      day_min:
        type: integer
      email_subject:
        type: string
      id:
        type: integer
      phase:
        type: string
      sort_order:
        type: integer
      whatsapp_body:
        type: string
    type: object
  service.ChargeDTO:
    properties:
      amount:
        type: number
      attachment_ext:
        type: string
      attachment_token:
        description: Adjunto (PDF/imagen) para enviar por WhatsApp; token sirve para
          URL pública.
        type: string
      client_email:
        type: string
      client_followup_channel:
        type: string
      client_id:
        type: integer
      client_name:
        description: 'en UI de cobros: solo nombre de sucursal (ver chargeClientLabelExpr)'
        type: string
      client_phone:
        type: string
      company_id:
        type: integer
      company_reminder_policy:
        allOf:
        - $ref: '#/definitions/domain.ReminderPolicy'
        description: CompanyReminderPolicy la de la empresa, para volver a ella desde
          una personalizada.
      created_at:
        type: string
      due_date:
        type: string
      id:
        type: integer
      next_reminder_at:
        additionalProperties:
          type: string
        description: 'NextReminderAt solo en el detalle: canales que siguen en espera
          y desde cuándo se puede volver a enviar.'
        type: object
      paid_at:
        type: string
      reminder_channel:
        type: string
      reminder_mode:
        description: 'Solo en el detalle: recordatorios automáticos. ReminderPolicy
          es la que rige (la propia o la de la empresa).'
        type: string
      reminder_policy:
        $ref: '#/definitions/domain.ReminderPolicy'
      status:
        type: string
    type: object
  service.CompanyChannels:
    properties:
      email:
        type: boolean
      whatsapp:
        type: boolean
    type: object
  service.CreateChargeInput:
    properties:
      amount:
        type: number
      client_id:
        type: integer
      due_date:
        type: string
      reminder_channel:
        type: string
      reminder_mode:
        type: string
      reminder_policy:
        $ref: '#/definitions/domain.ReminderPolicy'
    type: object
  service.CredentialChangePreview:
    properties:
      action:
        type: string
      action_label:
        type: string
      action_verb:
        type: string
      company:
        type: string
      expires_at:
        type: string
      provider:
        type: string
      provider_label:
        type: string
    type: object
  service.CredentialChangeReceipt:
    properties:
      action:
        type: string
      pending:
        type: boolean
      provider:
        type: string
      sent_to:
        type: string
    type: object
  service.DashboardResponse:
    properties:
      charges_needing_attention:
        items:
          $ref: '#/definitions/service.ChargeDTO'
        type: array
      product_name:
        type: string
      tagline:
        type: string
      totals:
        $ref: '#/definitions/repository.DashboardTotals'
    type: object
  service.MessagingPhaseDefaults:
    properties:
      email_body:
        type: string
      email_subject:
        type: string
      whatsapp:
        type: string
    type: object
  service.MessagingSettingsResponse:
    properties:
      defaults:
        additionalProperties:
          $ref: '#/definitions/service.MessagingPhaseDefaults'
        description: |-
          Defaults lo que recibe el cliente en cada fase con un cobro de ejemplo: la plantilla de WhatsApp
          aprobada (no editable) y el correo del sistema que se usa si la empresa no escribe el suyo.
        type: object
      payment_url_template:
        type: string
      reminder_policy:
        $ref: '#/definitions/domain.ReminderPolicy'
      send_time:
        description: SendTime hora diaria (HH:MM, hora de Chile por defecto) del ciclo
          de recordatorios automáticos.
        type: string
      templates:
        items:
          $ref: '#/definitions/repository.ReminderTemplateRow'
        type: array
      transfer_instructions:
        type: string
    type: object
  service.MessagingTemplateInput:
    properties:
      body:
        type: string
      day_max:
        type: integer
      day_min:
        type: integer
      email_subject:
        type: string
      phase:
        type: string
      sort_order:
        type: integer
      whatsapp_body:
        type: string
    type: object
  service.PatchChargeInput:
    properties:
      amount:
        type: number
      client_id:
        type: integer
      due_date:
        type: string
      reminder_channel:
        type: string
      reminder_mode:
        type: string
      reminder_policy:
        $ref: '#/definitions/domain.ReminderPolicy'
      set_paid:
        type: boolean
    type: object
  service.PaymentCredentialStatus:
    properties:
      fintoc:
        type: boolean
      khipu:
        type: boolean
      oneclick:
        type: boolean
      pending:
        items:
          $ref: '#/definitions/service.PendingCredentialChange'
        type: array
      transfer_gateway:
        type: string
      webpay:
        type: boolean
    type: object
  service.PaymentPortalView:
    properties:
      mode:
        type: string
      pending_url:
        type: string
      rejection:
        type: string
      url:
        type: string
    type: object
  service.PendingCredentialChange:
    properties:
      action:
        type: string
      expires_at:
        type: string
      provider:
        type: string
      sent_to:
        type: string
    type: object
  service.PendingPaymentPortalView:
    properties:
      company_id:
        type: integer
      company_name:
        type: string
      mode:
        type: string
      pending_at:
        type: string
      pending_url:
        type: string
      url:
        type: string
    type: object
  service.PlatformOverviewResponse:
    properties:
      companies:
        items:
          $ref: '#/definitions/repository.CompanyOverviewRow'
        type: array
      total_companies:
        type: integer
      total_overdue:
        type: number
      total_owed:
        type: number
      total_paid:
        type: number
      total_pending:
        type: number
    type: object
  service.SaveMessagingInput:
    properties:
      payment_url_template:
        type: string
      reminder_policy:
        allOf:
        - $ref: '#/definitions/domain.ReminderPolicy'
        description: ReminderPolicy nula deja la frecuencia como está.
      templates:
        items:
          $ref: '#/definitions/service.MessagingTemplateInput'
        type: array
      transfer_instructions:
        type: string
    type: object
  service.SavePaymentCredentialsInput:
    properties:
      fintoc_secret_key:
        type: string
      fintoc_webhook_secret:
        type: string
      khipu_api_key:
        type: string
      oneclick_api_key:
        type: string
      oneclick_mall_code:
        type: string
      oneclick_store_code:
        type: string
      transfer_gateway:
        type: string
      webpay_api_key:
        type: string
      webpay_commerce_code:
        type: string
    type: object
  service.SavePaymentPortalInput:
    properties:
      mode:
        type: string
      url:
        type: string
    type: object
info:
  contact: {}
  description: 'Aplicación principal de FlowPay: gestión de empresas, clientes, recordatorios,
    pagos y notificaciones.'
  title: FlowPay Backend API
  version: "1.0"
paths:
  /api/charges:
    get:
      description: Cobros de la empresa del token. Un member solo ve los de su cartera.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/service.ChargeDTO'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Listar cobros
      tags:
      - Cobros
    post:
      consumes:
      - application/json
      description: due_date en formato YYYY-MM-DD.
      parameters:
      - description: Datos del cobro
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.CreateChargeInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/controller.idResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Crear cobro
      tags:
      - Cobros
  /api/charges/{id}:
    delete:
      description: Solo el administrador de la empresa.
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Eliminar cobro
      tags:
      - Cobros
    get:
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChargeDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Obtener cobro
      tags:
      - Cobros
    patch:
      consumes:
      - application/json
      description: Campos opcionales. set_paid true marca cobrado hoy; false lo reabre
        y quita los pagos. Devuelve el cobro actualizado.
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      - description: Campos a cambiar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.PatchChargeInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ChargeDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Actualizar cobro
      tags:
      - Cobros
  /api/charges/{id}/attachment:
    post:
      consumes:
      - multipart/form-data
      description: PDF o imagen (máx. 8 MB) que se envía junto a los recordatorios
        por WhatsApp.
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      - description: Archivo
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Subir adjunto del cobro
      tags:
      - Cobros
  /api/charges/{id}/inbound-whatsapp:
    get:
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Message'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Mensajes de WhatsApp del cobro
      tags:
      - WhatsApp
  /api/charges/{id}/inbound-whatsapp/{msgId}/media/{index}:
    get:
      description: Imágenes, PDF, audio y video se muestran inline; el resto se entrega
        como descarga.
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      - description: ID del mensaje
        in: path
        name: msgId
        required: true
        type: integer
      - description: Índice del adjunto (desde 0)
        in: path
        name: index
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Descargar adjunto recibido por WhatsApp
      tags:
      - WhatsApp
  /api/charges/{id}/inbound-whatsapp/simulate:
    post:
      consumes:
      - application/json
      description: Solo disponible si FLOWPAY_ALLOW_WHATSAPP_SIMULATE está activo
        (desarrollo).
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      - description: Texto
        in: body
        name: body
        schema:
          $ref: '#/definitions/controller.simulateInboundBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Simular mensaje entrante
      tags:
      - WhatsApp
  /api/charges/{id}/read:
    post:
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Marcar conversación como leída
      tags:
      - Bandeja
  /api/charges/{id}/reminders:
    get:
      description: Recordatorios enviados para el cobro (línea de tiempo).
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.Reminder'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.errorResponse'
      security:
      - BearerAuth: []
      summary: Historial de recordatorios
      tags:
      - Cobros
    post:
      consumes:
      - application/json
      description: Body opcional. Sin channels usa los medios configurados para el
        cobro. Responde 429 si el canal sigue en espera.
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      - description: Canales (email, whatsapp)
        in: body
        name: body
        schema:
          $ref: '#/definitions/controller.sendReminderBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.okResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/controller.errorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/controller.reminderCooldownResponse'
      security:
      - BearerAuth: []
      summary: Enviar recordatorio ahora
      tags:
      - Cobros
  /api/charges/{id}/whatsapp:
    post:
      consumes:
      - application/json
      description: Solo dentro de la ventana de 24 h desde el último mensaje del cliente
        (409 si no).
      parameters:
      - description: ID del cobro
        in: path
        name: id
        required: true
        type: integer
      - description: Texto
        in: body
        name: body
        required: true
        schema:
